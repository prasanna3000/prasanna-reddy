<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Classroom</title>
  <meta name="description" content="An interactive classroom for my M.Tech courses: lessons on a chalkboard, worked problems, labs, flashcards and quizzes.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/">
      <span class="brand-bell" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30"><path d="M16 4c-5 0-8 4-8 9v6l-3 4h22l-3-4v-6c0-5-3-9-8-9z" fill="#f3c74f" stroke="#5e3b1a" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="26" r="3" fill="#5e3b1a"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name" id="school-name">The Classroom</span>
        <span class="brand-tag" id="school-tag">learn it, then teach it</span>
      </span>
    </a>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  </header>

  <main id="app" tabindex="-1">
    <div class="loading">Ringing the school bell…</div>
  </main>

  <footer class="site-footer">
    <span>Progress is saved in this browser only.</span>
    <button class="linkish" id="reset-progress" type="button">Reset my progress</button>
  </footer>

  <!-- core -->
  <script src="js/core/util.js"></script>
  <script src="js/core/widgets.js"></script>
  <script src="js/core/chalkplot.js"></script>
  <!-- widgets: add a <script> line here for each new widget file -->
  <script src="js/widgets/gd-linear.js"></script>
  <script src="js/widgets/lr-bowl.js"></script>
  <script src="js/widgets/metrics-calc.js"></script>
  <script src="js/widgets/feature-scaling.js"></script>
  <!-- app -->
  <script src="js/app.js"></script>
</body>
</html>
